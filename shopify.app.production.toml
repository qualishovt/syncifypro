# PRODUCTION app config (Fly.io, https://app.syncifypro.app). Deploy with:
#   npx shopify app deploy --config production
# Dev keeps using shopify.app.toml (separate Partners app), so `shopify app dev`
# never overwrites these URLs.

client_id = "30e7a0bb86f2c0ee2931e2a196467506"
application_url = "https://app.syncifypro.app"
embedded = true
name = "SyncifyPro"
handle = "syncifypro"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_orders,read_all_orders,write_orders,read_customers,write_customers,read_discounts,write_discounts,read_content,read_inventory,write_inventory,read_shipping,read_locations,read_files,read_companies,read_draft_orders,read_shopify_payments_payouts,read_shopify_payments_accounts,read_translations,read_locales,read_online_store_navigation,write_online_store_navigation,read_inventory_transfers,read_store_credit_accounts,read_publications,write_publications,read_gift_cards,write_gift_cards,read_markets,read_payment_terms"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.qrcode]
name = "QR Code"
description = "QR codes that link to products"

  [metaobjects.app.qrcode.access]
  admin = "merchant_read_write"

[metaobjects.app.qrcode.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.qrcode.fields.product]
name = "Product"
type = "product_reference"

[metaobjects.app.qrcode.fields.product_variant]
name = "Product Variant"
type = "variant_reference"

[metaobjects.app.qrcode.fields.destination]
name = "Destination"
type = "single_line_text_field"

[metaobjects.app.qrcode.fields.scans]
name = "Scans"
type = "number_integer"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri    = "/webhooks/bulk-operations"
  topics = ["bulk_operations/finish"]

  # Mandatory privacy webhooks (App Store requirement).
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://app.syncifypro.app/api/auth", "https://app.syncifypro.app/auth/callback", "https://app.syncifypro.app/auth/shopify/callback" ]

[build]
automatically_update_urls_on_dev = false
