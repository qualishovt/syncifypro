# Local Postgres for SyncifyPro.
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop + wipe data
#
# Matches DATABASE_URL in .env:
#   postgresql://postgres:postgrespass@127.0.0.1:5432/syncifypro
services:
  postgres:
    image: postgres:16
    container_name: syncifypro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: syncifypro
    ports:
      - "5432:5432"
    volumes:
      - syncifypro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncifypro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncifypro_pgdata:
